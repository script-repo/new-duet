name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never pick a live provider in CI, whatever secrets exist: tests use explicit mock configs.
  TANDEM_MOCK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.13"}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: uv sync --frozen
      - run: uv run pytest -q

  harnesses:
    name: harnesses (real Deep Agents + OpenAI Agents SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.13"}
      - run: uv sync --frozen --extra deepagents --extra openai-agents --extra mcp
      - run: uv run pytest -q tests/test_harnesses.py -rs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: tandem, POSTGRES_PASSWORD: tandem, POSTGRES_DB: tandem}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tandem" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TANDEM_TEST_DATABASE_URL: postgresql+psycopg://tandem:tandem@localhost:5432/tandem
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.13"}
      - run: uv sync --frozen --extra postgres
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.13"}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: UI is served by the Python app
        working-directory: .
        run: |
          test -f src/tandem/server/static/index.html
          uv sync --frozen
          uv run python -c "
          from fastapi.testclient import TestClient
          from tandem.config import Settings
          from tandem.runtime import Runtime
          from tandem.server.app import create_app
          rt = Runtime(Settings(mock=True, autostart=False, database_url='sqlite://'))
          with TestClient(create_app(rt, run_scheduler=False)) as c:
              r = c.get('/'); assert r.status_code == 200 and 'assets/' in r.text, r.text[:300]
              assert c.get('/manifest.webmanifest').status_code == 200
              assert c.get('/api/health').json()['mode'] == 'mock'
          print('UI served OK')"

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tandem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (mock mode)
        run: |
          docker run -d --name tandem -p 8000:8000 tandem:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health | python3 -c "import json,sys; h=json.load(sys.stdin); assert h['mode']=='mock', h; print(h)"
          curl -fs localhost:8000/ | grep -q 'assets/'
          curl -fs -X POST localhost:8000/api/checkin/run | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['new_events']>=1, r; print(r)"
          docker logs tandem
