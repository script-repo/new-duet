[project]
name = "tandem-agent"
version = "0.2.1"
description = "Tandem: an open, self-hosted proactive agent that works in the background and reaches out only when something needs you. Any model, any agent harness."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "script-repo" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sse-starlette>=2.1,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "httpx>=0.28,<1",
  "pyyaml>=6.0.2,<7",
  "python-multipart>=0.0.18",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "markdown-it-py>=3.0,<5",
  "cryptography>=44",
  "tzdata>=2024.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mcp = ["mcp>=1.2,<2"]
caldav = ["caldav>=1.4,<3"]
deepagents = ["deepagents>=0.2", "langchain>=1.0", "langchain-mcp-adapters>=0.1", "langchain-anthropic>=1.0", "langchain-openai>=1.0"]
claude-sdk = ["claude-agent-sdk>=0.1"]
openai-agents = ["openai-agents>=0.3"]
# The ambientq quality loop (docs/QUALITY.md): only for its integration test and local grading.
quality = ["ambientq @ git+https://github.com/script-repo/nai-recon.git@ambientq"]

[project.scripts]
tandem = "tandem.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1.0,<2", "ruff>=0.14,<1", "respx>=0.22,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tandem"]
artifacts = ["src/tandem/server/static/**"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "B008", "E501", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
