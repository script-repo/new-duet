# Tandem's harness, for quality tools such as ambientq (docs/QUALITY.md).
# The prompts are the real ones the engine loads; harness/*.yaml are generated by `tandem harness export`.
agent: tandem
goal: >-
  A proactive personal assistant. It watches the person's email, calendar, chat and payments, interrupts
  only for what needs them now (triage), writes a short morning brief, and does delegated work with tools,
  where every send, payment, post or delete waits for the person's approval.
system_prompt:
  - src/tandem/prompts/persona.md
  - src/tandem/prompts/rules.md
  - src/tandem/prompts/triage.md
  - src/tandem/prompts/brief.md
  - src/tandem/prompts/chat.md
  - src/tandem/prompts/worker.md
tools: harness/tools.yaml
guardrails: harness/guardrails.yaml
config: harness/agent.yaml
