apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandem
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO volume + SQLite: never two pods on /data at once
  template:
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: tandem
          image: ghcr.io/script-repo/new-duet:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tandem-config
            # Provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...) from .env; optional.
            - secretRef:
                name: tandem-env
                optional: true
          env:
            # Required: the pod will not start until secret tandem-auth exists (README.md).
            - name: TANDEM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tandem-auth
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tandem-data
