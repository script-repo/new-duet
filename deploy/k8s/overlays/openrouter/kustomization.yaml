# Live variant: OpenRouter free models. kubectl apply -k deploy/k8s/overlays/openrouter
# Needs OPENROUTER_API_KEY in secret tandem-env (see ../../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tandem
resources:
  - ../../base
configMapGenerator:
  # Keep the shared settings ConfigMap truthful (the explicit env in the patch is what wins).
  - name: tandem-config
    behavior: merge
    literals:
      - TANDEM_MOCK=false
      - TANDEM_CONFIG=/config/tandem.yaml
  # The product config, mounted at /config/tandem.yaml. Content-hashed, so editing it rolls the pod.
  - name: tandem-yaml
    files:
      - tandem.yaml
patches:
  - path: deployment-patch.yaml
